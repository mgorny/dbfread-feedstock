schema_version: 1

context:
  name: dbfread
  version: "2.0.7"
  compress_type: tar.gz
  hash_val: 07c8a9af06ffad3f6f03e8fe91ad7d2733e31a26d2b72c4dd4cfbae07ee3b73d

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.${{ compress_type }}
  sha256: ${{ hash_val }}

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dbfread
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: MIT
  license_file: LICENSE
  summary: read data from dbf files
  homepage: https://dbfread.readthedocs.io
  repository: https://github.com/olemb/dbfread
  documentation: https://dbfread.readthedocs.io

extra:
  recipe-maintainers:
    - pmlandwehr
