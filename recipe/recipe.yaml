schema_version: 1

context:
  version: "2.0.7"

package:
  name: dbfread
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/dbfread/dbfread-${{ version }}.tar.gz
  sha256: 07c8a9af06ffad3f6f03e8fe91ad7d2733e31a26d2b72c4dd4cfbae07ee3b73d

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - dbfread
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Read DBF Files with Python
  license: MIT
  license_file: LICENSE
  homepage: https://dbfread.readthedocs.io
  repository: https://github.com/olemb/dbfread
  documentation: https://dbfread.readthedocs.io

extra:
  recipe-maintainers:
    - pmlandwehr
    - mgorny
