{% set version = "2.0.7" %}

package:
  name: dbfread
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/d/dbfread/dbfread-{{ version }}.tar.gz
  sha256: 07c8a9af06ffad3f6f03e8fe91ad7d2733e31a26d2b72c4dd4cfbae07ee3b73d

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python
    - pip
    - setuptools
  run:
    - python

test:
  imports:
    - dbfread
  commands:
    - pip check
  requires:
    - pip
    - python

about:
  home: https://dbfread.readthedocs.io/
  summary: Read DBF Files with Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - mgorny
